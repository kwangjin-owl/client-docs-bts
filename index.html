<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시니어 자격증 접수 서비스</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5a5f66;
    --line: #d7dbdf;
    --pick: #1b5e7e;
    --pick-bg: #e7f1f6;
    --stop: #8a5a00;
    --stop-bg: #fdf2dc;
    --ok: #1c6b3a;
    --ok-bg: #e6f4ea;
    --bad: #a32d2d;
    --bad-bg: #fceceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 18px;
    line-height: 1.7;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
  .brand { font-size: 16px; color: var(--muted); margin: 0 0 32px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 22px; font-weight: 600; margin: 40px 0 8px; }
  .lead { font-size: 18px; color: var(--muted); margin: 0 0 24px; }

  .card {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    width: 100%; text-align: left; background: #fff;
    border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 24px; margin-bottom: 12px;
    font: inherit; color: inherit; cursor: pointer;
  }
  .card:hover { border-color: var(--pick); }
  .card:focus-visible { outline: 3px solid var(--pick); outline-offset: 2px; }
  .card.picked { border: 2px solid var(--pick); }
  .card.closed { background: #f7f8f9; cursor: not-allowed; }
  .card.closed .name, .card.closed .sub { color: #8b9096; }

  .name { font-size: 21px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 16px; color: var(--muted); margin: 0; }

  .tag { font-size: 16px; padding: 6px 14px; border-radius: 8px; white-space: nowrap; }
  .tag.on { background: var(--pick-bg); color: var(--pick); }
  .tag.go { color: var(--muted); }
  .tag.no { background: var(--stop-bg); color: var(--stop); }

  label { display: block; font-size: 17px; margin: 20px 0 6px; }
  input, select, textarea {
    width: 100%; font: inherit; color: inherit;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--pick); outline-offset: 1px; }
  .hint { font-size: 15px; color: var(--muted); margin: 4px 0 0; }

  .send {
    width: 100%; margin-top: 28px; padding: 18px;
    font: inherit; font-size: 20px; font-weight: 600;
    background: var(--pick); color: #fff; border: 0; border-radius: 12px; cursor: pointer;
  }
  .send:disabled { background: #9aa4ab; cursor: not-allowed; }

  .msg { margin-top: 16px; padding: 16px 20px; border-radius: 12px; font-size: 17px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.plain { border: 1px solid var(--line); color: var(--muted); font-size: 16px; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <p class="brand">두두자격지원센터</p>

  <h1>어떤 자격증을 신청하시나요</h1>
  <p class="lead">아래에서 하나를 눌러 주세요</p>

  <button type="button" class="card" data-cert="요양보호사" data-agency="두두보건">
    <span>
      <span class="name">요양보호사</span>
      <span class="sub">두두보건 · 아무 때나 접수 · 32,000원</span>
    </span>
    <span class="tag go">누르기 &rsaquo;</span>
  </button>

  <button type="button" class="card" data-cert="전기기능사" data-agency="두두넷">
    <span>
      <span class="name">전기기능사</span>
      <span class="sub">두두넷 · 8월 24일부터 접수 · 14,500원</span>
    </span>
    <span class="tag go">누르기 &rsaquo;</span>
  </button>

  <button type="button" class="card closed" disabled data-cert="공인중개사" data-agency="두두넷">
    <span>
      <span class="name">공인중개사</span>
      <span class="sub">두두넷 · 1차 접수 8월 7일 끝남</span>
    </span>
    <span class="tag no">올해 마감</span>
  </button>

  <h2>신청서 작성</h2>
  <p class="lead" id="picked-line">위에서 자격증을 먼저 골라 주세요</p>

  <label for="f-name">성함</label>
  <input id="f-name" type="text" placeholder="홍길동">

  <label for="f-phone">연락처</label>
  <input id="f-phone" type="text" placeholder="010-1234-5678">
  <p class="hint">숫자만 넣으셔도 됩니다</p>

  <label for="f-channel">어떻게 알고 오셨나요</label>
  <select id="f-channel">
    <option>인터넷</option>
    <option>전화</option>
    <option>방문</option>
    <option>지인 소개</option>
  </select>

  <label for="f-memo">남기실 말씀 (안 쓰셔도 됩니다)</label>
  <textarea id="f-memo" rows="3" placeholder="예: 딸이 대신 문의합니다"></textarea>

  <button type="button" class="send" id="send">신청서 내기</button>

  <p class="msg hide" id="msg"></p>
  <p class="msg plain" id="status">Supabase 연결 확인 중…</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const statusBox = document.getElementById("status");
  const msgBox = document.getElementById("msg");
  const pickedLine = document.getElementById("picked-line");
  const sendBtn = document.getElementById("send");

  let db = null;
  let picked = null;

  // 자격증 고르기
  const cards = document.querySelectorAll(".card:not(.closed)");
  cards.forEach(function (card) {
    card.addEventListener("click", function () {
      cards.forEach(function (c) {
        c.classList.remove("picked");
        var t = c.querySelector(".tag");
        t.className = "tag go";
        t.innerHTML = "누르기 &rsaquo;";
      });
      card.classList.add("picked");
      var t = card.querySelector(".tag");
      t.className = "tag on";
      t.textContent = "선택됨";

      picked = { cert: card.dataset.cert, agency: card.dataset.agency };
      pickedLine.textContent = picked.cert + " (" + picked.agency + ") 로 접수합니다";
    });
  });

  function show(text, kind) {
    msgBox.textContent = text;
    msgBox.className = "msg " + kind;
  }

  // Supabase 연결 — 키는 Vercel 환경변수에 있고 /api/config 가 꺼내 준다
  async function connect() {
    try {
      const r = await fetch("/api/config");
      if (!r.ok) {
        statusBox.textContent = "서버 함수 응답 " + r.status + " — api/config.js 위치 확인";
        return;
      }
      const conf = await r.json();
      if (!conf.url || !conf.key) {
        statusBox.textContent = "서버에 환경변수가 설정되어 있지 않습니다";
        return;
      }
      db = supabase.createClient(conf.url, conf.key);
      const res = await db.from("applications").select("*", { count: "exact", head: true });
      if (res.error) {
        statusBox.textContent = "연결 실패: " + res.error.message;
        return;
      }
      statusBox.textContent = "Supabase 연결됨 · applications 테이블 " + res.count + "건";
    } catch (e) {
      statusBox.textContent = "연결 실패: " + e.message;
    }
  }

  // 신청서 보내기
  sendBtn.addEventListener("click", async function () {
    const name = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.trim();

    if (!picked) { show("자격증을 먼저 골라 주세요.", "bad"); return; }
    if (!name) { show("성함을 넣어 주세요.", "bad"); return; }
    if (!phone) { show("연락처를 넣어 주세요.", "bad"); return; }
    if (!db) { show("아직 데이터베이스에 연결되지 않았습니다.", "bad"); return; }

    sendBtn.disabled = true;
    sendBtn.textContent = "보내는 중…";

    const res = await db.from("applications").insert({
      name: name,
      phone: phone,
      cert: picked.cert,
      agency: picked.agency,
      channel: document.getElementById("f-channel").value,
      memo: document.getElementById("f-memo").value.trim()
    });

    sendBtn.disabled = false;
    sendBtn.textContent = "신청서 내기";

    if (res.error) {
      show("저장 실패: " + res.error.message, "bad");
      return;
    }

    show("접수되었습니다. 담당자가 확인 후 연락드립니다.", "ok");
    document.getElementById("f-name").value = "";
    document.getElementById("f-phone").value = "";
    document.getElementById("f-memo").value = "";
    connect();
  });

  connect();
</script>
</body>
</html>
