<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>궁금한 것 물어보기 - 두두자격지원센터</title>
<style>
  :root {
    --ink:#1a1a1a; --muted:#5a5f66; --line:#dde1e4; --bg:#eef1f3; --card:#fff;
    --pick:#1b5e7e; --pick-bg:#e7f1f6;
    --bad:#a32d2d; --bad-bg:#fceceb;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:18px; line-height:1.7;
         font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 20px 24px;
          display:flex; flex-direction:column; min-height:auto; }
  .top { display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
  h1 { font-size:26px; font-weight:600; margin:0; }
  .back { font-size:16px; color:var(--pick); text-decoration:none; }
  .lead { font-size:17px; color:var(--muted); margin:8px 0 20px; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .chip { font:inherit; font-size:16px; padding:10px 16px; background:var(--card);
    border:1px solid var(--line); border-radius:999px; cursor:pointer; }
  .chip:hover { border-color:var(--pick); color:var(--pick); }


  .turn { margin-bottom:20px; }
  .q { background:var(--pick-bg); color:var(--pick); padding:12px 16px;
       border-radius:14px 14px 4px 14px; margin-left:auto; max-width:85%;
       width:fit-content; font-size:0.95em; }
  .a { background:var(--card); border:1px solid var(--line); padding:16px 18px; border-radius:14px 14px 14px 4px;
       max-width:100%; white-space:pre-wrap; line-height:1.85; }
  .a.err { background:var(--bad-bg); color:var(--bad); }
  .meta { font-size:14px; color:var(--muted); margin:6px 0 0 4px; }

  .ask { position:sticky; bottom:0; background:var(--bg); padding:16px 0;
         border-top:1px solid var(--line); display:flex; gap:10px; flex:none; }
  input { flex:1; font:inherit; padding:14px 16px; border:2px solid var(--line); border-radius:10px; }
  input:focus { outline:3px solid var(--pick); outline-offset:1px; }
  .send { font:inherit; font-size:17px; font-weight:600; padding:14px 20px;
          background:var(--pick); color:#fff; border:0; border-radius:10px;
          cursor:pointer; white-space:nowrap; flex:none; }
  .send:disabled { background:#9aa4ab; }

  .note { font-size:15px; color:var(--muted); margin-top:8px; }
  .empty { background:var(--card); border-radius:14px;
           padding:32px 20px; text-align:center; color:var(--muted); }
  .empty b { display:block; font-size:19px; font-weight:600; color:var(--ink); margin-bottom:8px; }
  .empty span { font-size:16px; line-height:1.7; }

  .foot { border-top:1px solid var(--line); margin-top:28px; }
  .foot-in { max-width:1360px; margin:0 auto; padding:22px 28px 40px;
             display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
  .foot .call { background:var(--card); border:2px solid var(--pick);
                border-radius:12px; padding:14px 20px; }
  .foot .call b { display:block; font-size:1.25em; color:var(--pick); }
  .foot .call span { font-size:0.82em; color:var(--muted); }
  .foot .help { flex:1; min-width:240px; font-size:0.85em; color:var(--muted); line-height:1.8; }
  .foot .help a { color:var(--pick); }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>궁금한 것 물어보기</h1>
    <a class="back" href="/">← 접수 화면으로</a>
  </div>
  <p class="lead" id="note">자격증 접수에 대해 물어보세요. 안내 문서에 있는 것만 답해 드립니다.</p>

  <div class="chips" id="chips"></div>

  <div class="log" id="log">
    <div class="empty" id="empty">
      <b>무엇이든 물어보세요</b>
      <span>접수 기간, 응시료, 준비물 같은 것을 물어보시면<br>
      안내 문서를 보고 답해 드립니다.<br>
      문서에 없는 것은 모른다고 말씀드립니다.</span>
    </div>
  </div>

  <div class="ask">
    <input id="q" type="text" placeholder="궁금한 것을 적어 주세요" autocomplete="off">
    <button class="send" id="send">물어보기</button>
  </div>

  <p class="note" style="margin-top:20px; padding-top:16px; border-top:1px solid var(--line)">
    문서에 없는 것은 답해 드릴 수 없습니다. 그럴 때는 고객센터 <b>02-000-0000</b>
    (평일 09:00 ~ 18:00)으로 전화 주십시오.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = function (id) { return document.getElementById(id); };
let CFG = null, DOCS = [], busy = false, db = null;

// 발주서 4절: 어떤 질문이 많이 들어오는지 보려면 질문을 남겨야 한다
async function logQ(question, answered, score, doc, route) {
  if (!db) return;
  try {
    await db.from("questions").insert({
      question: question,
      answered: answered,
      score: Number(score.toFixed(2)),
      doc_id: doc ? doc.id : null,
      doc_title: doc ? doc.title : null,
      route: route
    });
  } catch (e) {
    console.log("질문 기록 실패:", e.message);
  }
}

const SAMPLES = [
  "한식조리기능사 접수비가 얼마예요",
  "전기기능사 언제 접수해요",
  "요양보호사는 어디서 신청해요",
  "시험 볼 때 뭘 가져가야 하나요",
  "취소하면 돈 돌려받을 수 있나요"
];

// ---------- 검색 ----------
// 점수 = 겹친 질문 단어 수 / 질문 단어 수  (0.0 ~ 1.0)
// 개수로 재면 짧은 질문이 영원히 불리해진다.

function tokens(text) {
  return (text || "")
    .toLowerCase()
    .replace(/[^0-9a-z가-힣\s]/g, " ")
    .split(/\s+/)
    .filter(function (w) { return w.length >= 2 && CFG.STOPWORDS.indexOf(w) < 0; });
}

// 어르신이 쓰는 말을 문서 표기로 바꾼다
function expand(words) {
  const out = [];
  words.forEach(function (w) {
    out.push(w);
    Object.keys(CFG.SYNONYMS).forEach(function (key) {
      const list = CFG.SYNONYMS[key];
      if (key === w) { list.forEach(function (v) { out.push(v); }); return; }
      list.forEach(function (v) { if (w.indexOf(v) >= 0 || v.indexOf(w) >= 0) out.push(key); });
    });
  });
  return Array.from(new Set(out));
}

// 조사가 붙어도 잡히도록 부분 일치를 본다
function hits(word, bag) {
  return bag.some(function (t) { return t === word || t.indexOf(word) >= 0 || word.indexOf(t) >= 0; });
}

function score(question, doc) {
  const qWords = tokens(question);
  if (!qWords.length) return { s: 0 };
  const qAll = expand(qWords);
  const bodyBag = tokens(doc.title + " " + doc.body);
  const titleBag = tokens(doc.title);

  let matched = 0, titleHit = 0;
  qWords.forEach(function (w) {
    const variants = expand([w]);
    if (variants.some(function (v) { return hits(v, bodyBag); })) matched++;
    if (variants.some(function (v) { return hits(v, titleBag); })) titleHit++;
  });

  const base = matched / qWords.length;
  const bonus = titleHit / qWords.length * CFG.TITLE_WEIGHT;
  return { s: Math.min(1, base + bonus), matched: matched, total: qWords.length };
}

function search(question) {
  return DOCS
    .map(function (d) { const r = score(question, d); return { doc: d, s: r.s }; })
    .sort(function (a, b) { return b.s - a.s; })
    .slice(0, CFG.TOP_K);
}

// ---------- 화면 ----------
function addTurn(question) {
  const e = document.getElementById("empty");
  if (e) e.remove();
  const box = document.createElement("div");
  box.className = "turn";
  box.innerHTML = '<div class="q"></div><div class="a">생각하는 중…</div><p class="meta"></p>';
  box.querySelector(".q").textContent = question;
  $("log").appendChild(box);
  box.scrollIntoView({ behavior:"smooth", block:"end" });
  return box;
}
// 한 덩어리로 붙은 문장을 한 줄씩 떼어 놓는다. 어르신이 읽기 쉽도록.
function readable(t) {
  return String(t)
    .replace(/([다요])\.\s+/g, "$1.\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function fillTurn(box, text, meta, isErr) {
  const a = box.querySelector(".a");
  a.textContent = isErr ? text : readable(text);
  a.className = "a" + (isErr ? " err" : "");
  box.querySelector(".meta").textContent = meta;
  box.scrollIntoView({ behavior:"smooth", block:"end" });
}

// ---------- 물어보기 ----------
async function ask(question) {
  if (busy || !question.trim() || !CFG) return;
  busy = true;
  $("send").disabled = true;
  $("q").value = "";

  const box = addTurn(question);
  const found = search(question);
  const best = found[0];

  // 1) 점수가 충분하면 문서를 그대로 보여준다 (브라우저 안에서 끝남)
  if (best && best.s >= CFG.MIN_SCORE) {
    fillTurn(box, best.doc.body,
      "출처: " + (best.doc.source || best.doc.title) + " · 규칙 답변 (" + best.s.toFixed(2) + ")");
    logQ(question, true, best.s, best.doc, "규칙");
    busy = false; $("send").disabled = false; $("q").focus();
    return;
  }

  // 2) 못 찾으면 AI에게 넘긴다. 이때 문서 전체를 근거로 준다.
  //    근거 없이 넘기면 지어낸다.
  if (!CFG.USE_AI) {
    fillTurn(box, CFG.FALLBACK, "찾은 문서 없음 (최고 " + (best ? best.s.toFixed(2) : "0.00") + ")");
    logQ(question, false, best ? best.s : 0, null, "못찾음");
    busy = false; $("send").disabled = false; return;
  }

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: question,
        docs: DOCS,
        model: CFG.MODEL,
        fallback: CFG.FALLBACK
      })
    });
    const data = await r.json();
    if (data.error) {
      fillTurn(box, data.error, "AI 호출 단계", true);
    } else {
      fillTurn(box, data.answer, "AI 답변 · 문서 전체 참고 (검색 최고 " + (best ? best.s.toFixed(2) : "0.00") + ")");
      logQ(question, true, best ? best.s : 0, null, "AI");
    }
  } catch (e) {
    fillTurn(box, "연결 실패: " + e.message, "AI 호출 단계", true);
  }

  busy = false; $("send").disabled = false; $("q").focus();
}

// ---------- 시작 ----------
async function boot() {
  try {
    CFG = await fetch("/settings.json").then(function (r) { return r.json(); });
  } catch (e) {
    $("note").textContent = "settings.json을 못 읽었습니다: " + e.message;
    return;
  }

  try {
    const r = await fetch("/api/config");
    const conf = await r.json();
    if (!conf.url || !conf.key) { $("note").textContent = "서버에 환경변수가 설정되어 있지 않습니다"; return; }
    db = supabase.createClient(conf.url, conf.key);
    const res = await db.from("docs").select("*").order("id");
    if (res.error) { $("note").textContent = "문서 불러오기 실패: " + res.error.message; return; }
    DOCS = res.data || [];
    console.log("문서 " + DOCS.length + "건 · 기준값 " + CFG.MIN_SCORE);
  } catch (e) {
    $("note").textContent = "문서 불러오기 실패: " + e.message;
    return;
  }

  $("chips").innerHTML = SAMPLES.map(function (s) {
    return '<button class="chip" type="button">' + s + '</button>';
  }).join("");
  document.querySelectorAll(".chip").forEach(function (b) {
    b.addEventListener("click", function () { ask(b.textContent); });
  });
}

$("send").addEventListener("click", function () { ask($("q").value); });
$("q").addEventListener("keydown", function (e) { if (e.key === "Enter") ask($("q").value); });

// 접수 화면 안에 겹쳐 떠 있을 때는 되돌아가기 링크를 숨긴다
if (window.self !== window.top) {
  document.querySelector(".back").style.display = "none";
  document.querySelector(".wrap").style.padding = "20px 16px 24px";
  document.querySelector("h1").style.display = "none";
}

boot();
</script>
</body>
</html>
