<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>궁금한 것 물어보기 - 두두자격지원센터</title>
<style>
  :root {
    --ink:#1a1a1a; --muted:#5a5f66; --line:#d7dbdf;
    --pick:#1b5e7e; --pick-bg:#e7f1f6;
    --bad:#a32d2d; --bad-bg:#fceceb;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-size:18px; line-height:1.7;
         font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 20px 40px; }
  .top { display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
  h1 { font-size:26px; font-weight:600; margin:0; }
  .back { font-size:16px; color:var(--pick); text-decoration:none; }
  .lead { font-size:17px; color:var(--muted); margin:8px 0 20px; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .chip { font:inherit; font-size:16px; padding:10px 16px; background:#fff;
    border:1px solid var(--line); border-radius:999px; cursor:pointer; }
  .chip:hover { border-color:var(--pick); color:var(--pick); }

  .log { min-height:120px; }
  .turn { margin-bottom:20px; }
  .q { background:var(--pick-bg); color:var(--pick); padding:14px 18px;
       border-radius:14px 14px 4px 14px; margin-left:auto; max-width:85%; width:fit-content; }
  .a { background:#f7f8f9; padding:16px 18px; border-radius:14px 14px 14px 4px;
       max-width:90%; white-space:pre-wrap; }
  .a.err { background:var(--bad-bg); color:var(--bad); }
  .meta { font-size:14px; color:var(--muted); margin:6px 0 0 4px; }

  .ask { position:sticky; bottom:0; background:#fff; padding:16px 0 24px;
         border-top:1px solid var(--line); display:flex; gap:10px; }
  input { flex:1; font:inherit; padding:14px 16px; border:1px solid var(--line); border-radius:10px; }
  input:focus { outline:3px solid var(--pick); outline-offset:1px; }
  .send { font:inherit; font-size:18px; font-weight:600; padding:14px 24px;
          background:var(--pick); color:#fff; border:0; border-radius:10px; cursor:pointer; }
  .send:disabled { background:#9aa4ab; }

  .note { font-size:15px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>궁금한 것 물어보기</h1>
    <a class="back" href="/">← 접수 화면으로</a>
  </div>
  <p class="lead">자격증 접수에 대해 물어보세요. 안내 문서에 있는 것만 답해 드립니다.</p>

  <div class="chips" id="chips"></div>

  <div class="log" id="log"></div>

  <div class="ask">
    <input id="q" type="text" placeholder="예: 한식조리기능사 응시료가 얼마인가요" autocomplete="off">
    <button class="send" id="send">물어보기</button>
  </div>
  <p class="note" id="note">문서를 불러오는 중…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = function (id) { return document.getElementById(id); };
let CFG = null, DOCS = [], busy = false;

const SAMPLES = [
  "한식조리기능사 접수비가 얼마예요",
  "전기기능사 언제 접수해요",
  "요양보호사는 어디서 신청해요",
  "시험 볼 때 뭘 가져가야 하나요",
  "취소하면 돈 돌려받을 수 있나요"
];

// ---------- 검색 ----------
// 점수 = 겹친 질문 단어 수 / 질문 단어 수  (0.0 ~ 1.0)
// 개수로 재면 짧은 질문이 영원히 불리해진다.

function tokens(text) {
  return (text || "")
    .toLowerCase()
    .replace(/[^0-9a-z가-힣\s]/g, " ")
    .split(/\s+/)
    .filter(function (w) { return w.length >= 2 && CFG.STOPWORDS.indexOf(w) < 0; });
}

// 어르신이 쓰는 말을 문서 표기로 바꾼다
function expand(words) {
  const out = [];
  words.forEach(function (w) {
    out.push(w);
    Object.keys(CFG.SYNONYMS).forEach(function (key) {
      const list = CFG.SYNONYMS[key];
      if (key === w) { list.forEach(function (v) { out.push(v); }); return; }
      list.forEach(function (v) { if (w.indexOf(v) >= 0 || v.indexOf(w) >= 0) out.push(key); });
    });
  });
  return Array.from(new Set(out));
}

// 조사가 붙어도 잡히도록 부분 일치를 본다
function hits(word, bag) {
  return bag.some(function (t) { return t === word || t.indexOf(word) >= 0 || word.indexOf(t) >= 0; });
}

function score(question, doc) {
  const qWords = tokens(question);
  if (!qWords.length) return { s: 0 };
  const qAll = expand(qWords);
  const bodyBag = tokens(doc.title + " " + doc.body);
  const titleBag = tokens(doc.title);

  let matched = 0, titleHit = 0;
  qWords.forEach(function (w) {
    const variants = expand([w]);
    if (variants.some(function (v) { return hits(v, bodyBag); })) matched++;
    if (variants.some(function (v) { return hits(v, titleBag); })) titleHit++;
  });

  const base = matched / qWords.length;
  const bonus = titleHit / qWords.length * CFG.TITLE_WEIGHT;
  return { s: Math.min(1, base + bonus), matched: matched, total: qWords.length };
}

function search(question) {
  return DOCS
    .map(function (d) { const r = score(question, d); return { doc: d, s: r.s }; })
    .sort(function (a, b) { return b.s - a.s; })
    .slice(0, CFG.TOP_K);
}

// ---------- 화면 ----------
function addTurn(question) {
  const box = document.createElement("div");
  box.className = "turn";
  box.innerHTML = '<div class="q"></div><div class="a">생각하는 중…</div><p class="meta"></p>';
  box.querySelector(".q").textContent = question;
  $("log").appendChild(box);
  box.scrollIntoView({ behavior:"smooth", block:"end" });
  return box;
}
function fillTurn(box, text, meta, isErr) {
  const a = box.querySelector(".a");
  a.textContent = text;
  a.className = "a" + (isErr ? " err" : "");
  box.querySelector(".meta").textContent = meta;
  box.scrollIntoView({ behavior:"smooth", block:"end" });
}

// ---------- 물어보기 ----------
async function ask(question) {
  if (busy || !question.trim() || !CFG) return;
  busy = true;
  $("send").disabled = true;
  $("q").value = "";

  const box = addTurn(question);
  const found = search(question);
  const best = found[0];

  // 1) 점수가 충분하면 문서를 그대로 보여준다 (브라우저 안에서 끝남)
  if (best && best.s >= CFG.MIN_SCORE) {
    fillTurn(box, best.doc.body,
      "출처: " + (best.doc.source || best.doc.title) + " · 규칙 답변 (" + best.s.toFixed(2) + ")");
    busy = false; $("send").disabled = false; $("q").focus();
    return;
  }

  // 2) 못 찾으면 AI에게 넘긴다. 이때 문서 전체를 근거로 준다.
  //    근거 없이 넘기면 지어낸다.
  if (!CFG.USE_AI) {
    fillTurn(box, CFG.FALLBACK, "찾은 문서 없음 (최고 " + (best ? best.s.toFixed(2) : "0.00") + ")");
    busy = false; $("send").disabled = false; return;
  }

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: question,
        docs: DOCS,
        model: CFG.MODEL,
        fallback: CFG.FALLBACK
      })
    });
    const data = await r.json();
    if (data.error) {
      fillTurn(box, data.error, "AI 호출 단계", true);
    } else {
      fillTurn(box, data.answer, "AI 답변 · 문서 전체 참고 (검색 최고 " + (best ? best.s.toFixed(2) : "0.00") + ")");
    }
  } catch (e) {
    fillTurn(box, "연결 실패: " + e.message, "AI 호출 단계", true);
  }

  busy = false; $("send").disabled = false; $("q").focus();
}

// ---------- 시작 ----------
async function boot() {
  try {
    CFG = await fetch("/settings.json").then(function (r) { return r.json(); });
  } catch (e) {
    $("note").textContent = "settings.json을 못 읽었습니다: " + e.message;
    return;
  }

  try {
    const r = await fetch("/api/config");
    const conf = await r.json();
    if (!conf.url || !conf.key) { $("note").textContent = "서버에 환경변수가 설정되어 있지 않습니다"; return; }
    const db = supabase.createClient(conf.url, conf.key);
    const res = await db.from("docs").select("*").order("id");
    if (res.error) { $("note").textContent = "문서 불러오기 실패: " + res.error.message; return; }
    DOCS = res.data || [];
    $("note").textContent = "안내 문서 " + DOCS.length + "건을 보고 답합니다 · 기준값 " + CFG.MIN_SCORE;
  } catch (e) {
    $("note").textContent = "문서 불러오기 실패: " + e.message;
    return;
  }

  $("chips").innerHTML = SAMPLES.map(function (s) {
    return '<button class="chip" type="button">' + s + '</button>';
  }).join("");
  document.querySelectorAll(".chip").forEach(function (b) {
    b.addEventListener("click", function () { ask(b.textContent); });
  });
}

$("send").addEventListener("click", function () { ask($("q").value); });
$("q").addEventListener("keydown", function (e) { if (e.key === "Enter") ask($("q").value); });

boot();
</script>
</body>
</html>
